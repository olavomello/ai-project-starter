<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='3' height='7' x='1' y='8' rx='1' fill='%232a78d6'/%3E%3Crect width='3' height='11' x='6' y='4' rx='1' fill='%232a78d6'/%3E%3Crect width='3' height='14' x='11' y='1' rx='1' fill='%231baf7a'/%3E%3C/svg%3E">
<title>Agent Activity</title>
<style>
  :root {
    color-scheme: light;
    --surface-0: #f6f5f3;
    --surface-1: #fcfcfb;
    --border:    #e2e1dd;
    --text-1:    #0b0b0b;
    --text-2:    #52514e;
    --text-3:    #7c7a74;
    --series-1:  #2a78d6;
    --series-2:  #eb6834;
    --series-3:  #1baf7a;
    --good:      #0ca30c;
    --warning:   #fab219;
    --critical:  #d03b3b;
    --grid:      #eceae6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-0: #121211;
      --surface-1: #1a1a19;
      --border:    #32322f;
      --text-1:    #ffffff;
      --text-2:    #c3c2b7;
      --text-3:    #94938a;
      --series-1:  #3987e5;
      --series-2:  #d95926;
      --series-3:  #199e70;
      --grid:      #2a2a27;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-0: #121211;
    --surface-1: #1a1a19;
    --border:    #32322f;
    --text-1:    #ffffff;
    --text-2:    #c3c2b7;
    --text-3:    #94938a;
    --series-1:  #3987e5;
    --series-2:  #d95926;
    --series-3:  #199e70;
    --grid:      #2a2a27;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--surface-0); color: var(--text-1);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 16px 72px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
  h1 { font-size: 22px; font-weight: 650; letter-spacing: -0.01em; margin: 0; }
  .meta { color: var(--text-3); font-size: 13px; font-variant-numeric: tabular-nums; }
  button.theme {
    background: var(--surface-1); color: var(--text-2); border: 1px solid var(--border);
    border-radius: 7px; padding: 5px 11px; font: inherit; font-size: 13px; cursor: pointer;
  }
  button.theme:hover { color: var(--text-1); }
  h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
       color: var(--text-3); margin: 36px 0 12px; }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-top: 20px; }
  .tile .label { font-size: 12px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.05em; }
  .tile .value { font-size: 28px; font-weight: 640; letter-spacing: -0.02em; margin-top: 6px;
                 font-variant-numeric: tabular-nums; }
  .tile .sub { font-size: 12px; color: var(--text-3); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .grid2 { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 840px) { .grid2 { grid-template-columns: 1fr 1fr; } }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .ax { font-size: 11px; fill: var(--text-3); font-variant-numeric: tabular-nums; }
  .dl { font-size: 11px; font-weight: 600; fill: var(--text-2); font-variant-numeric: tabular-nums; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 0 0 14px; font-size: 12px; color: var(--text-2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 9px; height: 9px; border-radius: 2px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-weight: 600; color: var(--text-3); font-size: 11px;
       text-transform: uppercase; letter-spacing: 0.05em; padding: 0 10px 8px 0; }
  td { padding: 8px 10px 8px 0; border-top: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  td.name { font-variant-numeric: normal; }
  th.n, td.n { text-align: right; padding-right: 0; }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 99px; font-size: 11px; font-weight: 600; }
  .pill.ok { color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }
  .pill.warn { color: var(--warning); background: color-mix(in srgb, var(--warning) 18%, transparent); }
  .pill.bad { color: var(--critical); background: color-mix(in srgb, var(--critical) 14%, transparent); }
  details { margin-top: 12px; }
  summary { cursor: pointer; font-size: 12px; color: var(--text-3); }
  summary:hover { color: var(--text-1); }
  .empty { color: var(--text-2); }
  .empty code { background: var(--surface-0); border: 1px solid var(--border); border-radius: 5px;
                padding: 2px 6px; font-size: 13px; }
  .tip { position: fixed; pointer-events: none; opacity: 0; transition: opacity .1s;
         background: var(--text-1); color: var(--surface-1); font-size: 12px; line-height: 1.45;
         padding: 7px 10px; border-radius: 7px; z-index: 10; white-space: nowrap;
         font-variant-numeric: tabular-nums; }
  .hit { fill: transparent; }
  .note { font-size: 12px; color: var(--text-3); margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Agent Activity</h1>
      <div class="meta" id="meta">loading…</div>
    </div>
    <button class="theme" id="theme" type="button">Theme</button>
  </header>
  <div id="root"></div>
  <p class="note">
    Aggregates only — no prompts, file paths or source content are recorded.
    Generated by <code>node scripts/ai-report.mjs</code> from the local execution log.
  </p>
</div>
<div class="tip" id="tip"></div>

<script>
const tip = document.getElementById('tip');
function showTip(e, html) {
  tip.innerHTML = html; tip.style.opacity = '1';
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY - r.height - 8;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if (y < 8) y = e.clientY + 16;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
const hideTip = () => { tip.style.opacity = '0'; };

document.getElementById('theme').onclick = () => {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const cur = document.documentElement.dataset.theme || (dark ? 'dark' : 'light');
  document.documentElement.dataset.theme = cur === 'dark' ? 'light' : 'dark';
};

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = n => n == null ? '—' : n.toLocaleString();
const pct = v => v == null ? '—' : Math.round(v * 100) + '%';
const kilo = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(n);
const rateClass = v => v == null ? '' : v >= 0.8 ? 'ok' : v >= 0.5 ? 'warn' : 'bad';

function tiles(d) {
  const t = d.totals, r = d.rates;
  const items = [
    ['Tokens in', kilo(t.tokens_in), fmt(t.tokens_in) + ' total'],
    ['Cache read', pct(r.cache_read_ratio), kilo(t.cache_read) + ' of input reused'],
    ['Gate first pass', pct(r.gate_first_pass), pct(r.gate_pass) + ' pass overall'],
    d.cost
      ? ['Est. cost', '$' + d.cost.usd.toFixed(2), d.cost.unpriced ? d.cost.unpriced + ' execs unpriced' : 'all execs priced']
      : ['Est. cost', '—', 'fill docs/model-prices.json'],
    ['Executions', fmt(t.executions), fmt(t.tool_calls) + ' tool calls'],
  ];
  return `<div class="tiles">${items.map(([l, v, s]) =>
    `<div class="card tile"><div class="label">${esc(l)}</div><div class="value">${esc(v)}</div><div class="sub">${esc(s)}</div></div>`).join('')}</div>`;
}

// Line chart: input tokens vs cache-read tokens per day. Two series -> legend + direct end labels.
function lineChart(days) {
  if (days.length < 2) return `<div class="card"><h2 style="margin-top:0">Tokens per day</h2><p class="empty">Needs at least two days of records.</p></div>`;
  const W = 1040, H = 300, P = { t: 16, r: 62, b: 30, l: 54 };
  const max = Math.max(...days.flatMap(d => [d.tokens_in, d.cache_read])) || 1;
  const x = i => P.l + (i * (W - P.l - P.r)) / Math.max(days.length - 1, 1);
  const y = v => P.t + (1 - v / max) * (H - P.t - P.b);
  const path = k => days.map((d, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(d[k]).toFixed(1)}`).join('');
  const ticks = [0, max / 2, max];
  const series = [['tokens_in', 'var(--series-1)', 'input'], ['cache_read', 'var(--series-3)', 'cached']];
  const last = days.length - 1;
  return `<div class="card">
    <h2 style="margin-top:0">Tokens per day</h2>
    <div class="legend">${series.map(([, c, n]) =>
      `<span><i class="sw" style="background:${c}"></i>${n}</span>`).join('')}</div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Input and cached tokens per day">
      ${ticks.map(v => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>
         <text class="ax" x="${P.l - 8}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${kilo(Math.round(v))}</text>`).join('')}
      ${series.map(([k, c]) => `<path d="${path(k)}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`).join('')}
      ${series.map(([k, c, n]) => `<circle cx="${x(last).toFixed(1)}" cy="${y(days[last][k]).toFixed(1)}" r="4" fill="${c}" stroke="var(--surface-1)" stroke-width="2"/>
         <text class="dl" x="${(x(last) + 9).toFixed(1)}" y="${(y(days[last][k]) + 4).toFixed(1)}">${kilo(days[last][k])}</text>`).join('')}
      ${days.map((d, i) => {
        const show = days.length <= 6 || i === 0 || i === last || i === Math.floor(last / 2);
        return show ? `<text class="ax" x="${x(i).toFixed(1)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === last ? 'end' : 'middle'}">${d.day.slice(5)}</text>` : '';
      }).join('')}
      ${days.map((d, i) => {
        const w = (W - P.l - P.r) / Math.max(days.length, 1);
        return `<rect class="hit" x="${(x(i) - w / 2).toFixed(1)}" y="${P.t}" width="${w.toFixed(1)}" height="${H - P.t - P.b}"
          data-tip="<b>${esc(d.day)}</b><br>input ${fmt(d.tokens_in)}<br>cached ${fmt(d.cache_read)}<br>${d.executions} execution(s)"/>`;
      }).join('')}
    </svg>
  </div>`;
}

// Horizontal bars: one measure (magnitude) -> single sequential hue, direct labels.
function barChart(rows, key, title) {
  if (!rows.length) return '';
  const top = rows.slice(0, 8);
  const max = Math.max(...top.map(r => r.tokens_in)) || 1;
  const BH = 22, GAP = 8, LW = 128, W = 520;
  const H = top.length * (BH + GAP);
  return `<div class="card">
    <h2 style="margin-top:0">${esc(title)}</h2>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">
      ${top.map((r, i) => {
        const yy = i * (BH + GAP);
        const bw = Math.max((r.tokens_in / max) * (W - LW - 56), 2);
        return `<text class="ax" x="0" y="${yy + BH / 2 + 4}" style="fill:var(--text-2)">${esc(String(r[key]).slice(0, 20))}</text>
          <rect x="${LW}" y="${yy}" width="${bw.toFixed(1)}" height="${BH}" rx="4" fill="var(--series-1)"/>
          <text class="dl" x="${(LW + bw + 8).toFixed(1)}" y="${yy + BH / 2 + 4}">${kilo(r.tokens_in)}</text>
          <rect class="hit" x="0" y="${yy}" width="${W}" height="${BH}"
            data-tip="<b>${esc(r[key])}</b><br>${r.executions} execution(s)<br>input ${fmt(r.tokens_in)}<br>output ${fmt(r.tokens_out)}<br>gate first pass ${pct(r.gate_first_pass)}"/>`;
      }).join('')}
    </svg>
    <details><summary>Table view</summary>
      <table><thead><tr><th>${esc(key.replace(/_/g, ' '))}</th><th class="n">Execs</th><th class="n">In</th><th class="n">Out</th><th class="n">1st pass</th></tr></thead>
      <tbody>${rows.map(r => `<tr><td class="name">${esc(r[key])}</td><td class="n">${r.executions}</td><td class="n">${fmt(r.tokens_in)}</td><td class="n">${fmt(r.tokens_out)}</td><td class="n">${pct(r.gate_first_pass)}</td></tr>`).join('')}</tbody></table>
    </details>
  </div>`;
}

function agentTable(d) {
  const rows = d.by_agent;
  if (!rows.length) return '';
  return `<div class="card">
    <h2 style="margin-top:0">Agents</h2>
    <table><thead><tr><th>Agent</th><th class="n">Execs</th><th class="n">Tokens in</th><th class="n">Tool calls</th><th class="n">Gate 1st pass</th></tr></thead>
    <tbody>${rows.map(r => `<tr>
      <td class="name">${esc(r.agent)}</td>
      <td class="n">${r.executions}</td>
      <td class="n">${fmt(r.tokens_in)}</td>
      <td class="n">${fmt(r.tool_calls)}</td>
      <td class="n"><span class="pill ${rateClass(r.gate_first_pass)}">${pct(r.gate_first_pass)}</span></td>
    </tr>`).join('')}</tbody></table>
    <p class="note">PRs: ${d.pr_split.mechanical} mechanical · ${d.pr_split.administrator} administrator</p>
  </div>`;
}

function render(d) {
  document.getElementById('meta').textContent =
    `${d.log_records} execution${d.log_records === 1 ? '' : 's'} · generated ${new Date(d.generated_at).toLocaleString()}`;
  document.getElementById('root').innerHTML =
    tiles(d) +
    '<h2>Trend</h2>' + lineChart(d.by_day) +
    '<h2>Breakdown</h2><div class="grid2">' +
      barChart(d.by_task, 'task_type', 'Tokens by task type') +
      barChart(d.by_model, 'model', 'Tokens by model') +
    '</div>' +
    '<h2>Team</h2>' + agentTable(d);
  for (const el of document.querySelectorAll('[data-tip]')) {
    el.addEventListener('mousemove', e => showTip(e, el.dataset.tip));
    el.addEventListener('mouseleave', hideTip);
  }
}

fetch('data.json', { cache: 'no-store' })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => { if (!d.log_records) throw new Error('empty'); render(d); })
  .catch(() => {
    document.getElementById('meta').textContent = 'no data yet';
    document.getElementById('root').innerHTML =
      `<div class="card empty" style="margin-top:20px">
        <p>No execution data. Log a task, then regenerate:</p>
        <p><code>node scripts/ai-log.mjs --task-type build-feature --tokens-in 1200 --gate pass</code></p>
        <p><code>node scripts/ai-report.mjs</code></p>
        <p class="note">Commit <code>dashboard/data.json</code> for the deployed dashboard to pick it up.</p>
      </div>`;
  });
</script>
</body>
</html>
