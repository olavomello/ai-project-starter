[package]
name = "ai-dash-desktop"
version = "0.1.0"
edition = "2024"
description = "A small desktop window for AI Dash: shows the project's local dashboard, keeps a tray icon and raises native notifications."
license = "UNLICENSED"
publish = false

[dependencies]
notify-rust = "4"
serde_json = "1"
tao = "0.37"
tray-icon = "0.26"
wry = "0.57"

# Small and boring: this program only hosts a webview, so size matters more than speed.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
